name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ziglang
      - run: sh build.sh
      - run: sh package.sh dev
      - uses: actions/upload-artifact@v4
        with:
          name: WindroseFXCore-dev
          path: WindroseFXCore-dev.zip
