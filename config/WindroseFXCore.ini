; WindroseFXCore configuration. 1 = on, 0 = off.
; Changes take effect the next time you launch the game.

[FXCore]
Enabled=1

; System timer resolution in 100-nanosecond units. 5000 = 0.5 ms, 10000 = 1 ms, 0 = leave alone.
; Lets UE's frame limiter and thread waits wake on time, which smooths frame pacing.
TimerResolution100ns=5000

; Stop Windows from applying power throttling (EcoQoS) or timer coalescing to the game.
DisablePowerThrottling=1

; 0 = Normal, 1 = Above Normal (recommended), 2 = High (can starve Discord/drivers; not advised).
ProcessPriority=1

; Give GameThread, RenderThread and RHIThread each their own CPU module (FX) or core (SMT CPUs).
PlaceCriticalThreads=1

; Keep UE's background worker pool off the cores the critical threads and audio mixer prefer.
IsolateBackgroundWorkers=1

; Priority floor of Above Normal for GameThread/RenderThread/RHIThread.
BoostCriticalPriority=1

; Raise the audio mixer's priority so it never misses an audio buffer (prevents crackle when the CPU is saturated).
BoostAudioPriority=1

; Priority used for the audio mixer: 15 = time-critical (default, what pro audio software uses), 2 = highest.
AudioMixerPriority=15

; Give the audio mixer its own preferred core, kept clear of background workers.
PlaceAudioThread=1

; --- Optional: bigger engine audio buffer (fixes dropouts and static) ---
; Windrose has no menu option for this. When on, the mod writes these two lines to
;   %LOCALAPPDATA%\R5\Saved\Config\Windows\Engine.ini
; at every launch (the game removes them when it exits):
;   [/Script/WindowsTargetPlatform.WindowsTargetSettings]
;   AudioCallbackBufferFrameSize / AudioNumBuffersToEnqueue
; The first time, your existing Engine.ini (if any) is copied to Engine.ini.WindroseFXCore.bak.
; Set back to 0 (or Enabled=0) and launch once: your original values are restored.
; A bigger buffer adds some audio delay: 2048 x 4 at 48 kHz is up to about 0.17 s.
AudioBufferFix=0
; Frames per buffer, e.g. 1024, 2048, 4096. Range 256-8192.
AudioBufferFrames=2048
; Buffers queued ahead: 2-8. Fewer = less delay, more = more slack.
AudioBuffersToEnqueue=4

; How often new game threads are picked up: every second for the first N seconds, then every ScanSlowMs.
ScanFastSeconds=180
ScanSlowMs=5000

; 1 = log every background worker too (for troubleshooting).
VerboseLog=0
